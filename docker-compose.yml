name: careerforge

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: careerforge
      POSTGRES_USER: careerforge
      POSTGRES_PASSWORD: careerforge
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerforge -d careerforge"]
      interval: 5s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: src/CareerForge.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=careerforge;Username=careerforge;Password=careerforge
      Jwt__Key: local-compose-key-change-before-production-123456
      Jwt__Issuer: careerforge-api
      Jwt__Audience: careerforge-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "5080:8080"

  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
    depends_on:
      - api
    ports:
      - "5173:80"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./infra/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./infra/observability/tempo.yml:/etc/tempo.yml:ro
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: careerforge
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    ports:
      - "3000:3000"

volumes:
  postgres-data:
